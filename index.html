<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Moto-Care Pro | Global Edition</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/intl-tel-input/17.0.19/css/intlTelInput.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root { 
            --bg-color: #0f1215; --card-bg: #1c2227; --primary: #00ffa3; 
            --accent-red: #ff3d71; --text-main: #ffffff; --text-dim: #9da5b1; 
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
        body { background-color: var(--bg-color); color: var(--text-main); font-family: 'Segoe UI', sans-serif; margin: 0; }
        
        /* Auth Screen */
        #authScreen { display: flex; flex-direction: column; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .auth-card { background: var(--card-bg); width: 100%; max-width: 400px; padding: 30px; border-radius: 25px; border: 1px solid #2d363f; text-align: center; }
        
        /* input ও tel ইনপুট স্টাইল */
        input, .iti { width: 100% !important; margin: 8px 0; }
        input { padding: 14px; background: #2d363f; border: 1px solid #3d4752; border-radius: 12px; color: white; font-size: 15px; }
        .iti__single-country { color: #000; } /* দেশের লিস্টের টেক্সট কালো রাখার জন্য */

        .btn { width: 100%; padding: 16px; border-radius: 14px; border: none; font-weight: 700; cursor: pointer; transition: 0.3s; margin-top: 10px; font-size: 16px; }
        .btn-primary { background: linear-gradient(90deg, #00ffa3, #00d1ff); color: #000; }
        .btn-outline { background: none; border: 1px solid var(--primary); color: var(--primary); font-size: 14px; }

        /* Dashboard Styles */
        #mainApp { display: none; padding: 15px; max-width: 500px; margin: auto; }
        .header { display: flex; justify-content: space-between; align-items: center; background: var(--card-bg); padding: 15px; border-radius: 20px; border: 1px solid #2d363f; margin-bottom: 20px; }
        .odo-box { background: #1c2227; padding: 30px; border-radius: 25px; text-align: center; border-bottom: 4px solid var(--primary); margin-bottom: 20px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .card { background: var(--card-bg); padding: 20px 15px; border-radius: 22px; text-align: center; border: 1px solid #2d363f; }
    </style>
</head>
<body>

    <section id="authScreen">
        <div class="auth-card">
            <i class="fas fa-motorcycle" style="font-size: 40px; color: var(--primary); margin-bottom: 15px;"></i>
            <h2 id="authTitle" style="color:var(--primary)">Sign In</h2>
            
            <div id="regFields" style="display: none;">
                <input type="text" id="userName" placeholder="Full Name">
                <input type="tel" id="userPhone">
            </div>
            
            <input type="email" id="userEmail" placeholder="Email Address">
            <input type="password" id="userPass" placeholder="Password (min 6 chars)">
            
            <button class="btn btn-primary" id="authBtn" onclick="handleAuth()">Login</button>
            <button class="btn btn-outline" id="toggleAuth" onclick="toggleAuthMode()">Create New Account</button>
        </div>
    </section>

    <section id="mainApp">
        <header class="header">
            <div><h2 id="dispName">Welcome</h2><p id="dispBike">Checking setup...</p></div>
            <button onclick="logout()" style="background:#2d363f; border:none; color:white; padding:10px; border-radius:10px;"><i class="fas fa-sign-out-alt"></i></button>
        </header>
        <section class="odo-box"><span>Total Odometer</span><h1 id="mainOdo" style="font-size:45px; margin:10px 0;">0.0</h1></section>
        <button id="trackBtn" class="btn btn-primary" onclick="toggleTracking()"><i class="fas fa-play"></i> Start Ride</button>
    </section>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/intl-tel-input/17.0.19/js/intlTelInput.min.js"></script>
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBYP2X8KQaF-1S7IpMqSdQ6DKAbGZMoags",
            authDomain: "moto-care-pro.firebaseapp.com",
            projectId: "moto-care-pro",
            storageBucket: "moto-care-pro.firebasestorage.app",
            messagingSenderId: "621207883659",
            appId: "1:621207883659:web:e1ba58f7aec638c5dca98e"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Phone Input Initialization
        const phoneInput = document.querySelector("#userPhone");
        const iti = window.intlTelInput(phoneInput, {
            initialCountry: "auto",
            geoIpLookup: function(success, failure) {
                fetch("https://ipapi.co/json").then(res => res.json()).then(data => success(data.country_code)).catch(() => success("MY"));
            },
            utilsScript: "https://cdnjs.cloudflare.com/ajax/libs/intl-tel-input/17.0.19/js/utils.js"
        });

        let isLoginMode = true;
        let currentUser = null;

        window.toggleAuthMode = () => {
            isLoginMode = !isLoginMode;
            document.getElementById('authTitle').innerText = isLoginMode ? "Sign In" : "Registration";
            document.getElementById('regFields').style.display = isLoginMode ? "none" : "block";
            document.getElementById('authBtn').innerText = isLoginMode ? "Login" : "Sign Up";
        };

        window.handleAuth = async () => {
            const email = document.getElementById('userEmail').value;
            const pass = document.getElementById('userPass').value;
            
            if (isLoginMode) {
                try { await signInWithEmailAndPassword(auth, email, pass); } catch(e) { alert(e.message); }
            } else {
                const name = document.getElementById('userName').value;
                const fullPhone = iti.getNumber(); // এটি কান্ট্রি কোডসহ ফুল নাম্বার দেবে
                
                if(!iti.isValidNumber()) return alert("Please enter a valid phone number");

                try {
                    const res = await createUserWithEmailAndPassword(auth, email, pass);
                    await setDoc(doc(db, "users", res.user.uid), {
                        name: name, phone: fullPhone, email: email,
                        bikeData: { totalOdo: 0, fuelLimit: 150, oilLimit: 2000, lastFuelOdo: 0, lastOilOdo: 0, bikeName: "" }
                    });
                } catch(e) { alert(e.message); }
            }
        };

        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                document.getElementById('authScreen').style.display = "none";
                document.getElementById('mainApp').style.display = "block";
                // Load data logic...
            } else {
                document.getElementById('authScreen').style.display = "flex";
                document.getElementById('mainApp').style.display = "none";
            }
        });

        window.logout = () => signOut(auth);
    </script>
</body>
</html>
