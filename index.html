<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#00ffa3">
<title>Moto-Care Pro</title>

<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

<style>
body{background:#0f1215;color:#fff;font-family:sans-serif;margin:0;text-align:center}
.card{background:#1c2227;margin:10px;padding:20px;border-radius:20px}
.btn{padding:15px;border:none;border-radius:10px;margin:5px;cursor:pointer}
.primary{background:#00ffa3;color:#000}
.stop{background:#ff3d71;color:#fff}
input{padding:10px;margin:5px;border-radius:8px;border:none;width:80%}
</style>
</head>

<body>

<h2>Moto-Care Pro</h2>

<div id="auth">
<input id="email" placeholder="Email"><br>
<input id="pass" placeholder="Password" type="password"><br>
<button class="btn primary" onclick="login()">Login</button>
<button class="btn" onclick="register()">Register</button>
</div>

<div id="app" style="display:none">

<div class="card">
<h1 id="odo">0 KM</h1>
<button id="trackBtn" class="btn primary">Start Ride</button>
</div>

<div class="card">
<p>Trip: <span id="trip">0</span> KM</p>
<p>Speed: <span id="speed">0</span> km/h</p>
<p>Time: <span id="time">0:00</span></p>
</div>

<div class="card">
<p>Fuel Left: <span id="fuel">0</span> KM</p>
<button onclick="refill()">Refill</button>
</div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
import { getFirestore, doc, setDoc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

// 🔥 YOUR CONFIG
const app = initializeApp({
  apiKey: "AIzaSyBYP2X8KQaF-1S7IpMqSdQ6DKAbGZMoags",
  authDomain: "moto-care-pro.firebaseapp.com",
  projectId: "moto-care-pro",
  storageBucket: "moto-care-pro.firebasestorage.app",
  messagingSenderId: "621207883659",
  appId: "1:621207883659:web:e1ba58f7aec638c5dca98e"
});

const auth = getAuth(app);
const db = getFirestore(app);

// DATA
let user=null;
let bikeData={totalOdo:0,fuelLimit:150,lastFuelOdo:0};
let watchId=null,lastPos=null,trip=0,startTime=0;

// LOGIN
window.login=async()=>{
  await signInWithEmailAndPassword(auth,email.value,pass.value);
};

// REGISTER
window.register=async()=>{
  const res=await createUserWithEmailAndPassword(auth,email.value,pass.value);
  await setDoc(doc(db,"users",res.user.uid),{bikeData});
};

// AUTH STATE
onAuthStateChanged(auth,async u=>{
  if(u){
    user=u;
    auth.style.display="none";
    appDiv.style.display="block";

    const d=await getDoc(doc(db,"users",u.uid));
    if(d.exists()) bikeData=d.data().bikeData;

    loadLocal();
    updateUI();
  }
});

// LOCAL SAVE
function saveLocal(){
  localStorage.setItem("bikeData",JSON.stringify(bikeData));
}
function loadLocal(){
  const d=localStorage.getItem("bikeData");
  if(d) bikeData=JSON.parse(d);
}

// DISTANCE
function calcDist(a,b,c,d){
  const R=6371;
  const dLat=(c-a)*Math.PI/180;
  const dLon=(d-b)*Math.PI/180;
  const x=Math.sin(dLat/2)**2+Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin(dLon/2)**2;
  return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));
}

// UI
function updateUI(speed=0){
  odo.innerText=bikeData.totalOdo.toFixed(1)+" KM";
  tripEl.innerText=trip.toFixed(2);
  speedEl.innerText=speed.toFixed(0);

  if(startTime){
    const s=Math.floor((Date.now()-startTime)/1000);
    timeEl.innerText=Math.floor(s/60)+":"+(s%60).toString().padStart(2,'0');
  }

  const fuelLeft=bikeData.fuelLimit-(bikeData.totalOdo-bikeData.lastFuelOdo);
  fuel.innerText=fuelLeft.toFixed(0);

  if(fuelLeft<30) notify("Fuel Low!");
}

// NOTIFY
function notify(msg){
  if(Notification.permission==="granted"){
    new Notification(msg);
  }
}
Notification.requestPermission();

// TRACK
trackBtn.onclick=()=>{
  if(!watchId){
    trip=0;
    startTime=Date.now();

    trackBtn.innerText="Stop Ride";
    trackBtn.classList.add("stop");

    watchId=navigator.geolocation.watchPosition(pos=>{
      let speed=0;

      if(lastPos){
        const d=calcDist(
          lastPos.coords.latitude,
          lastPos.coords.longitude,
          pos.coords.latitude,
          pos.coords.longitude
        );

        const t=(pos.timestamp-lastPos.timestamp)/1000;
        speed=(d/t)*3600;

        if(d>0.003){
          bikeData.totalOdo+=d;
          trip+=d;
        }
      }

      lastPos=pos;
      updateUI(speed);
      saveLocal();

    },null,{
      enableHighAccuracy:false,
      maximumAge:3000
    });

  }else{
    navigator.geolocation.clearWatch(watchId);
    watchId=null;
    lastPos=null;

    updateDoc(doc(db,"users",user.uid),{bikeData});

    trackBtn.innerText="Start Ride";
    trackBtn.classList.remove("stop");
  }
};

// REFILL
window.refill=()=>{
  bikeData.lastFuelOdo=bikeData.totalOdo;
  updateUI();
  updateDoc(doc(db,"users",user.uid),{bikeData});
};

// ELEMENTS
const odo=document.getElementById("odo");
const tripEl=document.getElementById("trip");
const speedEl=document.getElementById("speed");
const timeEl=document.getElementById("time");
const fuel=document.getElementById("fuel");
const trackBtn=document.getElementById("trackBtn");
const appDiv=document.getElementById("app");

// SW
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js');
}
</script>

</body>
</html>
