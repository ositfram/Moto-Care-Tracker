<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Moto-Care Pro | Global Edition</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/intl-tel-input/17.0.19/css/intlTelInput.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root { 
            --bg-color: #0f1215; --card-bg: #1c2227; --primary: #00ffa3; 
            --accent-red: #ff3d71; --text-main: #ffffff; --text-dim: #9da5b1; 
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
        body { background-color: var(--bg-color); color: var(--text-main); font-family: 'Segoe UI', sans-serif; margin: 0; }
        
        /* AUTH SCREEN DESIGNS */
        #authScreen { display: flex; flex-direction: column; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .auth-card { background: var(--card-bg); width: 100%; max-width: 400px; padding: 30px; border-radius: 25px; border: 1px solid #2d363f; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        input, .iti { width: 100% !important; margin: 8px 0; }
        input { padding: 14px; background: #2d363f; border: 1px solid #3d4752; border-radius: 12px; color: white; font-size: 15px; }

        /* DASHBOARD DESIGNS */
        #mainApp { display: none; padding: 15px; max-width: 450px; margin: auto; min-height: 100vh; }
        .header { display: flex; justify-content: space-between; align-items: center; background: var(--card-bg); padding: 15px 20px; border-radius: 20px; margin-bottom: 20px; border: 1px solid #2d363f; }
        .header h2 { margin: 0; font-size: 18px; color: var(--primary); }
        .header p { margin: 4px 0 0; font-size: 11px; color: var(--text-dim); }

        .settings-btn { background: #2d363f; border: none; color: white; width: 40px; height: 40px; border-radius: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center; }

        .odo-section { background: linear-gradient(145deg, #1c2227, #13181c); padding: 25px; border-radius: 25px; text-align: center; border-bottom: 4px solid var(--primary); margin-bottom: 20px; box-shadow: 0 10px 20px rgba(0,0,0,0.3); }
        .odo-display { display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 10px; }
        .odo-display h1 { font-size: 44px; margin: 0; font-family: 'Courier New', monospace; font-weight: bold; color: #fff; text-shadow: 0 0 10px rgba(0, 255, 163, 0.3); }

        .btn { width: 100%; padding: 16px; border-radius: 14px; border: none; font-weight: 700; cursor: pointer; transition: 0.3s; margin-top: 10px; font-size: 16px; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .btn-primary { background: linear-gradient(90deg, #00ffa3, #00d1ff); color: #000; box-shadow: 0 8px 20px rgba(0, 255, 163, 0.2); }
        .btn-outline { background: none; border: 1px solid var(--primary); color: var(--primary); font-size: 13px; }
        .btn-stop { background: var(--accent-red) !important; color: white !important; }

        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 20px; }
        .card { background: var(--card-bg); padding: 18px 12px; border-radius: 20px; text-align: center; border: 1px solid #2d363f; }
        .card i { font-size: 22px; color: var(--primary); margin-bottom: 8px; }

        /* BATTERY & FUEL ANIMATION STYLES (Point 3) */
        .bar-bg { background: #2d363f; height: 6px; border-radius: 10px; overflow: hidden; margin: 10px 0; }
        .bar { height: 100%; transition: width 0.3s ease-in-out, background-color 0.5s; width: 0%; }
        
        /* Dynamic Colors for Battery Style Progress (High, Mid, Low) */
        .bar-high { background-color: var(--primary) !important; } /* High > 50% */
        .bar-mid { background-color: #ffb800 !important; } /* Mid < 50% */
        .bar-low { background-color: var(--accent-red) !important; } /* Low < 20% */

        /* CSS Refill Animation */
        @keyframes fuelRefill { 
            0% { width: 0%; } 
            100% { width: 100%; } 
        }
        .animate-refill { animation: fuelRefill 1s ease-out forwards !important; }

        /* MODAL STYLES */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 100; justify-content: center; align-items: center; padding: 20px; }
        .modal-content { background: var(--card-bg); padding: 25px; border-radius: 25px; width: 100%; max-width: 380px; border: 1px solid #2d363f; }
    </style>
</head>
<body>

    <section id="authScreen">
        <div class="auth-card">
            <i class="fas fa-motorcycle" style="font-size: 45px; color: var(--primary); margin-bottom: 15px;"></i>
            <h2 id="authTitle" style="color:var(--primary)">Sign In</h2>
            <div id="regFields" style="display: none;">
                <input type="text" id="userName" placeholder="Full Name (e.g. Raihan Sharker)">
                <input type="tel" id="userPhone">
            </div>
            <input type="email" id="userEmail" placeholder="Email Address">
            <input type="password" id="userPass" placeholder="Password (min 6 chars)">
            <button class="btn btn-primary" id="authBtn" onclick="handleAuth()">Login</button>
            <button class="btn btn-outline" id="toggleAuth" onclick="toggleAuthMode()">Create New Account</button>
        </div>
    </section>

    <section id="mainApp">
        <header class="header">
            <div>
                <h2 id="dispUserName">Hello</h2>
                <p id="dispBike">Bike Info Loading...</p>
            </div>
            <div style="display:flex; gap:10px;">
                <button class="settings-btn" onclick="toggleModal('setupModal')"><i class="fas fa-motorcycle"></i></button>
                <button class="settings-btn" style="background:var(--accent-red)" onclick="logout()"><i class="fas fa-sign-out-alt"></i></button>
            </div>
        </header>

        <section class="odo-section">
            <div style="font-size: 10px; color: var(--text-dim); text-transform: uppercase;">Total Odometer</div>
            <div class="odo-display">
                <h1 id="mainOdo">0.0</h1>
                <button class="settings-btn" style="width:30px; height:30px; font-size:12px;" onclick="editOdo()"><i class="fas fa-edit"></i></button>
            </div>
        </section>

        <button id="trackBtn" class="btn btn-primary" onclick="toggleTracking()">
            <i class="fas fa-play"></i> Start Ride
        </button>

        <div class="grid">
            <div class="card">
                <i class="fas fa-gas-pump"></i>
                <div style="font-size:12px; color:var(--text-dim);">Fuel Range</div>
                <div class="val" id="fuelVal" style="font-weight:bold; margin:5px 0;">0 KM</div>
                <div class="bar-bg"><div id="fuelBar" class="bar"></div></div>
                <button class="btn-outline" style="border:none; text-decoration:underline; cursor:pointer;" onclick="resetTask('fuel')">Refilled</button>
            </div>
            <div class="card">
                <i class="fas fa-oil-can"></i>
                <div style="font-size:12px; color:var(--text-dim);">Engine Oil</div>
                <div class="val" id="oilVal" style="font-weight:bold; margin:5px 0;">0 KM</div>
                <div class="bar-bg"><div id="oilBar" class="bar"></div></div>
                <button class="btn-outline" style="border:none; text-decoration:underline; cursor:pointer;" onclick="resetTask('oil')">Changed</button>
            </div>
        </div>
    </section>

    <div id="setupModal" class="modal">
        <div class="modal-content">
            <h3 style="color:var(--primary); margin-top:0;">Bike Configuration</h3>
            <input type="text" id="inBikeName" placeholder="Bike Name (e.g. Honda Wave)">
            <input type="text" id="inBikePlate" placeholder="Plate Number (e.g. MDT9144)">
            <input type="number" id="inFuelLimit" placeholder="Fuel Limit (e.g. 150 KM)">
            <input type="number" id="inOilLimit" placeholder="Oil Limit (e.g. 2000 KM)">
            <button class="btn btn-primary" onclick="saveBikeSetup()">Save to Cloud</button>
            <button class="btn btn-outline" onclick="toggleModal('setupModal')">Cancel</button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/intl-tel-input/17.0.19/js/intlTelInput.min.js"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Firebase Configuration (Same as your initial input)
        const firebaseConfig = {
            apiKey: "AIzaSyBYP2X8KQaF-1S7IpMqSdQ6DKAbGZMoags",
            authDomain: "moto-care-pro.firebaseapp.com",
            projectId: "moto-care-pro",
            storageBucket: "moto-care-pro.firebasestorage.app",
            messagingSenderId: "621207883659",
            appId: "1:621207883659:web:e1ba58f7aec638c5dca98e"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Int Telephone Input (Country Detection)
        const phoneInput = document.querySelector("#userPhone");
        const iti = window.intlTelInput(phoneInput, {
            initialCountry: "auto",
            geoIpLookup: success => fetch("https://ipapi.co/json").then(res => res.json()).then(data => success(data.country_code)).catch(() => success("MY")),
            utilsScript: "https://cdnjs.cloudflare.com/ajax/libs/intl-tel-input/17.0.19/js/utils.js"
        });

        let isLoginMode = true;
        let currentUser = null;
        let bikeData = { totalOdo: 0.0, fuelLimit: 150, oilLimit: 2000, lastFuelOdo: 0, lastOilOdo: 0, bikeName: "My Bike", bikePlate: "" };

        // Authentication Handlers
        window.toggleAuthMode = () => {
            isLoginMode = !isLoginMode;
            document.getElementById('authTitle').innerText = isLoginMode ? "Sign In" : "Registration";
            document.getElementById('regFields').style.display = isLoginMode ? "none" : "block";
            document.getElementById('authBtn').innerText = isLoginMode ? "Login" : "Sign Up";
        };

        window.handleAuth = async () => {
            const email = document.getElementById('userEmail').value;
            const pass = document.getElementById('userPass').value;
            if(!email || !pass) return alert("Enter credentials");

            try {
                if (isLoginMode) {
                    await signInWithEmailAndPassword(auth, email, pass);
                } else {
                    const name = document.getElementById('userName').value;
                    const phone = iti.getNumber();
                    const country = iti.getSelectedCountryData().name;
                    if(!name) return alert("Please enter your name");
                    if(!iti.isValidNumber()) return alert("Invalid phone number");
                    
                    const res = await createUserWithEmailAndPassword(auth, email, pass);
                    // Point 2: Saving user full info on Cloud
                    await setDoc(doc(db, "users", res.user.uid), { 
                        name, 
                        phone, 
                        email, 
                        country,
                        bikeData 
                    });
                }
            } catch (err) { alert(err.message); }
        };

        onAuthStateChanged(auth, async user => {
            if (user) {
                currentUser = user;
                document.getElementById('authScreen').style.display = "none";
                document.getElementById('mainApp').style.display = "block";
                loadData();
            } else {
                document.getElementById('authScreen').style.display = "flex";
                document.getElementById('mainApp').style.display = "none";
            }
        });

        async function loadData() {
            const d = await getDoc(doc(db, "users", currentUser.uid));
            if (d.exists()) {
                const data = d.data();
                // Point 1: Displaying First Name (Hi, Raihan)
                const fullName = data.name || "User";
                const firstName = fullName.split(' ')[0];
                document.getElementById('dispUserName').innerText = "Hi, " + firstName;
                
                bikeData = data.bikeData || bikeData;
                updateUI();
            }
        }

        // Updating UI with GPS kilometer decrease logic (Battery Style)
        function updateUI() {
            document.getElementById('mainOdo').innerText = bikeData.totalOdo.toFixed(1);
            document.getElementById('dispBike').innerText = `${bikeData.bikeName} | ${bikeData.bikePlate || 'No Plate'}`;
            
            // Fuel Logic
            const fuelUsed = bikeData.totalOdo - bikeData.lastFuelOdo;
            let fLeft = Math.max(0, bikeData.fuelLimit - fuelUsed);
            document.getElementById('fuelVal').innerText = fLeft.toFixed(1) + " KM";
            updateProgressBar("fuelBar", fLeft / bikeData.fuelLimit);

            // Oil Logic
            const oilUsed = bikeData.totalOdo - bikeData.lastOilOdo;
            let oLeft = Math.max(0, bikeData.oilLimit - oilUsed);
            document.getElementById('oilVal').innerText = oLeft.toFixed(1) + " KM";
            updateProgressBar("oilBar", oLeft / bikeData.oilLimit);
        }

        // Battery style progress bar coloring (Point 3)
        function updateProgressBar(barId, percentage) {
            const bar = document.getElementById(barId);
            bar.style.width = (percentage * 100) + "%";
            bar.className = "bar"; // Reset classes

            if (percentage > 0.5) { bar.classList.add("bar-high"); }
            else if (percentage > 0.2) { bar.classList.add("bar-mid"); }
            else { bar.classList.add("bar-low"); }
        }

        // Action Buttons Handlers
        window.saveBikeSetup = async () => {
            bikeData.bikeName = document.getElementById('inBikeName').value || bikeData.bikeName;
            bikeData.bikePlate = document.getElementById('inBikePlate').value || bikeData.bikePlate;
            bikeData.fuelLimit = parseFloat(document.getElementById('inFuelLimit').value) || bikeData.fuelLimit;
            bikeData.oilLimit = parseFloat(document.getElementById('inOilLimit').value) || bikeData.oilLimit;
            
            await setDoc(doc(db, "users", currentUser.uid), { bikeData: bikeData }, { merge: true });
            toggleModal('setupModal');
            updateUI();
        };

        window.editOdo = async () => {
            let n = prompt("Set Odometer (KM):", bikeData.totalOdo);
            if(n) { 
                bikeData.totalOdo = parseFloat(n); 
                await updateDoc(doc(db, "users", currentUser.uid), { bikeData: bikeData }); 
                updateUI(); 
            }
        };

        // CSS Refill Animation Logic (Point 3)
        window.resetTask = async (type) => {
            if(confirm("Confirm reset?")) {
                const barId = type === 'fuel' ? 'fuelBar' : 'oilBar';
                const bar = document.getElementById(barId);
                bar.classList.add("animate-refill"); // Add animation class
                
                if(type==='fuel') bikeData.lastFuelOdo = bikeData.totalOdo;
                else bikeData.lastOilOdo = bikeData.totalOdo;
                
                await updateDoc(doc(db, "users", currentUser.uid), { bikeData: bikeData });
                
                setTimeout(() => {
                    bar.classList.remove("animate-refill"); // Remove after 1s
                    updateUI();
                }, 1000);
            }
        };

        // GPS Tracker with simulated odometer increase
        let watchId = null;
        window.toggleTracking = () => {
            const btn = document.getElementById('trackBtn');
            if(!watchId) {
                btn.innerHTML = '<i class="fas fa-stop"></i> Stop Ride';
                btn.classList.add("btn-stop");
                watchId = navigator.geolocation.watchPosition(pos => {
                    bikeData.totalOdo += 0.01; // Simulating movement by increasing Odo
                    updateUI();
                }, null, { enableHighAccuracy: true });
            } else {
                btn.innerHTML = '<i class="fas fa-play"></i> Start Ride';
                btn.classList.remove("btn-stop");
                navigator.geolocation.clearWatch(watchId);
                watchId = null;
                updateDoc(doc(db, "users", currentUser.uid), { bikeData: bikeData });
            }
        };

        // UI Helpers
        window.toggleModal = id => {
            const m = document.getElementById(id);
            m.style.display = (m.style.display === 'flex') ? 'none' : 'flex';
        };
        window.logout = () => signOut(auth);
    </script>
</body>
</html>
