<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Moto-Care Pro | PWA Edition</title>
    
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/intl-tel-input/17.0.19/css/intlTelInput.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root { 
            --bg-color: #0f1215; --card-bg: #1c2227; --primary: #00ffa3; 
            --accent-red: #ff3d71; --text-main: #ffffff; --text-dim: #9da5b1; 
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
        body { background-color: var(--bg-color); color: var(--text-main); font-family: 'Segoe UI', sans-serif; margin: 0; overflow-x: hidden; }
        
        /* Auth Screen */
        #authScreen { display: flex; flex-direction: column; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .auth-card { background: var(--card-bg); width: 100%; max-width: 400px; padding: 30px; border-radius: 25px; border: 1px solid #2d363f; text-align: center; }
        input, .iti { width: 100% !important; margin: 8px 0; }
        input { padding: 14px; background: #2d363f; border: 1px solid #3d4752; border-radius: 12px; color: white; font-size: 15px; }

        /* Dashboard */
        #mainApp { display: none; padding: 15px; max-width: 450px; margin: auto; min-height: 100vh; }
        .header { display: flex; justify-content: space-between; align-items: center; background: var(--card-bg); padding: 15px 20px; border-radius: 20px; margin-bottom: 20px; border: 1px solid #2d363f; }
        .header h2 { margin: 0; font-size: 18px; color: var(--primary); }
        
        .settings-btn { background: #2d363f; border: none; color: white; width: 40px; height: 40px; border-radius: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center; }

        .odo-section { background: linear-gradient(145deg, #1c2227, #13181c); padding: 25px; border-radius: 25px; text-align: center; border-bottom: 4px solid var(--primary); margin-bottom: 20px; }
        .odo-display h1 { font-size: 44px; margin: 0; font-family: 'Courier New', monospace; font-weight: bold; }

        .btn { width: 100%; padding: 16px; border-radius: 14px; border: none; font-weight: 700; cursor: pointer; font-size: 16px; display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 10px; }
        .btn-primary { background: linear-gradient(90deg, #00ffa3, #00d1ff); color: #000; }
        .btn-stop { background: var(--accent-red) !important; color: white !important; }
        .btn-outline { background: none; border: 1px solid var(--primary); color: var(--primary); font-size: 13px; }

        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 20px; }
        .card { background: var(--card-bg); padding: 18px 12px; border-radius: 20px; text-align: center; border: 1px solid #2d363f; position: relative; overflow: hidden; }
        
        /* Battery Bars */
        .bar-bg { background: #2d363f; height: 8px; border-radius: 10px; overflow: hidden; margin: 12px 0; border: 1px solid #111; }
        .bar { height: 100%; transition: width 0.5s ease-in-out, background-color 0.5s; width: 0%; }
        .bar-high { background: #00ffa3; box-shadow: 0 0 10px #00ffa3; }
        .bar-mid { background: #ffb800; box-shadow: 0 0 10px #ffb800; }
        .bar-low { background: #ff3d71; box-shadow: 0 0 10px #ff3d71; }

        /* Animation for Refill */
        @keyframes refillPulse { 
            0% { transform: scaleX(0); } 
            100% { transform: scaleX(1); } 
        }
        .animate-refill { animation: refillPulse 1s ease-out; transform-origin: left; }

        /* Modals */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 1000; justify-content: center; align-items: center; padding: 20px; }
        .modal-content { background: var(--card-bg); padding: 25px; border-radius: 25px; width: 100%; max-width: 380px; }
    </style>
</head>
<body>

    <section id="authScreen">
        <div class="auth-card">
            <i class="fas fa-motorcycle" style="font-size: 45px; color: var(--primary); margin-bottom: 15px;"></i>
            <h2 id="authTitle" style="color:var(--primary)">Sign In</h2>
            <div id="regFields" style="display: none;">
                <input type="text" id="userName" placeholder="Full Name">
                <input type="tel" id="userPhone">
            </div>
            <input type="email" id="userEmail" placeholder="Email Address">
            <input type="password" id="userPass" placeholder="Password">
            <button class="btn btn-primary" id="authBtn" onclick="handleAuth()">Login</button>
            <button class="btn btn-outline" id="toggleAuth" onclick="toggleAuthMode()">Create New Account</button>
        </div>
    </section>

    <section id="mainApp">
        <header class="header">
            <div>
                <h2 id="dispUserName">Hi, Rider</h2>
                <p id="dispBike">Honda Wave | MDT9144</p>
            </div>
            <div style="display:flex; gap:10px;">
                <button class="settings-btn" onclick="toggleModal('setupModal')"><i class="fas fa-motorcycle"></i></button>
                <button class="settings-btn" style="background:var(--accent-red)" onclick="logout()"><i class="fas fa-power-off"></i></button>
            </div>
        </header>

        <section class="odo-section">
            <div style="font-size: 10px; color: var(--text-dim); text-transform: uppercase;">Odometer</div>
            <div class="odo-display">
                <h1 id="mainOdo">0.0</h1>
                <button class="settings-btn" style="width:30px; height:30px; font-size:12px; margin-top:5px;" onclick="editOdo()"><i class="fas fa-pen"></i></button>
            </div>
        </section>

        <button id="trackBtn" class="btn btn-primary" onclick="toggleTracking()">
            <i class="fas fa-play"></i> Start Ride
        </button>

        <div class="grid">
            <div class="card">
                <i class="fas fa-gas-pump"></i>
                <div style="font-size:11px; color:var(--text-dim)">Fuel Range</div>
                <div id="fuelVal" style="font-weight:bold; font-size:18px; margin:5px 0;">0 KM</div>
                <div class="bar-bg"><div id="fuelBar" class="bar"></div></div>
                <button class="btn-outline" style="border:none; text-decoration:underline;" onclick="resetTask('fuel')">Refill</button>
            </div>
            <div class="card">
                <i class="fas fa-oil-can"></i>
                <div style="font-size:11px; color:var(--text-dim)">Engine Oil</div>
                <div id="oilVal" style="font-weight:bold; font-size:18px; margin:5px 0;">0 KM</div>
                <div class="bar-bg"><div id="oilBar" class="bar"></div></div>
                <button class="btn-outline" style="border:none; text-decoration:underline;" onclick="resetTask('oil')">Change</button>
            </div>
        </div>
    </section>

    <div id="setupModal" class="modal">
        <div class="modal-content">
            <h3 style="color:var(--primary); margin-top:0;">Configuration</h3>
            <input type="text" id="inBikeName" placeholder="Bike Name">
            <input type="text" id="inBikePlate" placeholder="Plate Number">
            <input type="number" id="inFuelLimit" placeholder="Fuel Limit (KM)">
            <input type="number" id="inOilLimit" placeholder="Oil Limit (KM)">
            <button class="btn btn-primary" onclick="saveBikeSetup()">Save Configuration</button>
            <button class="btn btn-outline" onclick="toggleModal('setupModal')">Cancel</button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/intl-tel-input/17.0.19/js/intlTelInput.min.js"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBYP2X8KQaF-1S7IpMqSdQ6DKAbGZMoags",
            authDomain: "moto-care-pro.firebaseapp.com",
            projectId: "moto-care-pro",
            storageBucket: "moto-care-pro.firebasestorage.app",
            messagingSenderId: "621207883659",
            appId: "1:621207883659:web:e1ba58f7aec638c5dca98e"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Int Tel Input
        const phoneInput = document.querySelector("#userPhone");
        const iti = window.intlTelInput(phoneInput, {
            initialCountry: "auto",
            geoIpLookup: success => fetch("https://ipapi.co/json").then(res => res.json()).then(data => success(data.country_code)).catch(() => success("MY")),
            utilsScript: "https://cdnjs.cloudflare.com/ajax/libs/intl-tel-input/17.0.19/js/utils.js"
        });

        let isLoginMode = true;
        let currentUser = null;
        let wakeLock = null;
        let bikeData = { totalOdo: 0.0, fuelLimit: 150, oilLimit: 2000, lastFuelOdo: 0, lastOilOdo: 0, bikeName: "My Bike", bikePlate: "" };

        // AUTH LOGIC
        window.toggleAuthMode = () => {
            isLoginMode = !isLoginMode;
            document.getElementById('authTitle').innerText = isLoginMode ? "Sign In" : "Register";
            document.getElementById('regFields').style.display = isLoginMode ? "none" : "block";
            document.getElementById('authBtn').innerText = isLoginMode ? "Login" : "Sign Up";
        };

        window.handleAuth = async () => {
            const email = document.getElementById('userEmail').value;
            const pass = document.getElementById('userPass').value;
            if(!email || !pass) return alert("Missing info");

            try {
                if (isLoginMode) {
                    await signInWithEmailAndPassword(auth, email, pass);
                } else {
                    const name = document.getElementById('userName').value;
                    const phone = iti.getNumber();
                    const country = iti.getSelectedCountryData().name;
                    const res = await createUserWithEmailAndPassword(auth, email, pass);
                    await setDoc(doc(db, "users", res.user.uid), { name, phone, email, country, bikeData });
                }
            } catch (err) { alert(err.message); }
        };

        onAuthStateChanged(auth, async user => {
            if (user) {
                currentUser = user;
                document.getElementById('authScreen').style.display = "none";
                document.getElementById('mainApp').style.display = "block";
                loadData();
            } else {
                document.getElementById('authScreen').style.display = "flex";
                document.getElementById('mainApp').style.display = "none";
            }
        });

        async function loadData() {
            const d = await getDoc(doc(db, "users", currentUser.uid));
            if (d.exists()) {
                const data = d.data();
                const firstName = (data.name || "User").split(' ')[0];
                document.getElementById('dispUserName').innerText = "Hi, " + firstName;
                bikeData = data.bikeData || bikeData;
                updateUI();
            }
        }

        // UI & PROGRESS BARS
        function updateUI() {
            document.getElementById('mainOdo').innerText = bikeData.totalOdo.toFixed(1);
            document.getElementById('dispBike').innerText = `${bikeData.bikeName} | ${bikeData.bikePlate || '---'}`;
            
            updateComponent('fuel', bikeData.fuelLimit, bikeData.lastFuelOdo);
            updateComponent('oil', bikeData.oilLimit, bikeData.lastOilOdo);
        }

        function updateComponent(type, limit, last) {
            const left = Math.max(0, limit - (bikeData.totalOdo - last));
            const pct = left / limit;
            document.getElementById(`${type}Val`).innerText = left.toFixed(1) + " KM";
            const bar = document.getElementById(`${type}Bar`);
            bar.style.width = (pct * 100) + "%";
            bar.className = "bar " + (pct > 0.5 ? "bar-high" : (pct > 0.2 ? "bar-mid" : "bar-low"));
        }

        // BACKGROUND GPS TRACKING (CRITICAL FIX)
        let watchId = null;
        let lastPos = null;

        window.toggleTracking = async () => {
            const btn = document.getElementById('trackBtn');
            if(!watchId) {
                // Request Wake Lock to keep GPS alive even when locked
                if ('wakeLock' in navigator) {
                    try { wakeLock = await navigator.wakeLock.request('screen'); } catch(e){}
                }

                btn.innerHTML = '<i class="fas fa-stop"></i> Stop Ride';
                btn.classList.add("btn-stop");

                watchId = navigator.geolocation.watchPosition(pos => {
                    if(lastPos) {
                        const d = calcDist(lastPos.coords.latitude, lastPos.coords.longitude, pos.coords.latitude, pos.coords.longitude);
                        if(d > 0.005) { // 5 meters move
                            bikeData.totalOdo += d;
                            updateUI();
                        }
                    }
                    lastPos = pos;
                }, null, { enableHighAccuracy: true, maximumAge: 0, timeout: 5000 });

            } else {
                btn.innerHTML = '<i class="fas fa-play"></i> Start Ride';
                btn.classList.remove("btn-stop");
                navigator.geolocation.clearWatch(watchId);
                if(wakeLock) wakeLock.release();
                watchId = null; lastPos = null;
                await updateDoc(doc(db, "users", currentUser.uid), { bikeData: bikeData });
            }
        };

        function calcDist(lat1, lon1, lat2, lon2) {
            const R = 6371;
            const dLat = (lat2-lat1)*Math.PI/180;
            const dLon = (lon2-lon1)*Math.PI/180;
            const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        }

        // ACTIONS
        window.resetTask = async (type) => {
            if(confirm("Confirm Reset?")) {
                const bar = document.getElementById(type + 'Bar');
                bar.classList.add('animate-refill');
                if(type==='fuel') bikeData.lastFuelOdo = bikeData.totalOdo;
                else bikeData.lastOilOdo = bikeData.totalOdo;
                await updateDoc(doc(db, "users", currentUser.uid), { bikeData: bikeData });
                setTimeout(() => { bar.classList.remove('animate-refill'); updateUI(); }, 1000);
            }
        };

        window.saveBikeSetup = async () => {
            bikeData.bikeName = document.getElementById('inBikeName').value || bikeData.bikeName;
            bikeData.bikePlate = document.getElementById('inBikePlate').value || bikeData.bikePlate;
            bikeData.fuelLimit = parseFloat(document.getElementById('inFuelLimit').value) || 150;
            bikeData.oilLimit = parseFloat(document.getElementById('inOilLimit').value) || 2000;
            await setDoc(doc(db, "users", currentUser.uid), { bikeData }, { merge: true });
            toggleModal('setupModal'); updateUI();
        };

        window.editOdo = async () => {
            let n = prompt("Current Odometer:", bikeData.totalOdo);
            if(n) { bikeData.totalOdo = parseFloat(n); updateUI(); }
        };

        window.toggleModal = id => {
            const m = document.getElementById(id);
            m.style.display = (m.style.display === 'flex') ? 'none' : 'flex';
        };

        window.logout = () => signOut(auth);

        // Register Service Worker for PWA
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').then(() => console.log("PWA Active"));
        }
    </script>
</body>
</html>
