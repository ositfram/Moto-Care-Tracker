<script type="module">

// 🔥 ADD THIS (top এর দিকে)
let saveTimer = null;

// 🔥 LOCAL BACKUP
function saveLocal(){
  localStorage.setItem("bikeData", JSON.stringify(bikeData));
}

function loadLocal(){
  const data = localStorage.getItem("bikeData");
  if(data) bikeData = JSON.parse(data);
}

// 🔥 AUTO SAVE
function startAutoSave(){
  saveTimer = setInterval(()=>{
    if(currentUser){
      updateDoc(doc(db,"users",currentUser.uid),{bikeData});
      saveLocal();
    }
  },10000);
}

function stopAutoSave(){
  clearInterval(saveTimer);
}

// 🔥 FIX AUTH (replace your handleAuth)
window.handleAuth = async () => {
  const email = document.getElementById('userEmail').value;
  const pass = document.getElementById('userPass').value;

  if(!email || !pass){
    alert("Email & Password required!");
    return;
  }

  try{
    if(isLoginMode){
      await signInWithEmailAndPassword(auth,email,pass);
    }else{
      const name = document.getElementById('userName').value;
      const phone = iti.getNumber();

      if(!name || !phone){
        alert("Fill all fields!");
        return;
      }

      const res = await createUserWithEmailAndPassword(auth,email,pass);

      await setDoc(doc(db,"users",res.user.uid),{
        name,
        phone,
        email,
        country: iti.getSelectedCountryData().name,
        bikeData
      });
    }
  }catch(err){
    alert(err.message);
    console.error(err);
  }
};

// 🔥 UPDATE AUTH STATE (small fix)
onAuthStateChanged(auth, async user => {
  if (user) {
    currentUser = user;

    loadLocal(); // 🔥 NEW

    document.getElementById('authScreen').style.display = "none";
    document.getElementById('mainApp').style.display = "block";

    const d = await getDoc(doc(db, "users", user.uid));
    if(d.exists()){
      const data = d.data();
      bikeData = data.bikeData || bikeData;
      updateUI();
    }
  } else {
    document.getElementById('authScreen').style.display = "flex";
    document.getElementById('mainApp').style.display = "none";
  }
});

// 🔥 GPS OPTIMIZED TRACKING
window.toggleTracking = async () => {
  const btn = document.getElementById('trackBtn');

  if(!watchId){

    startAutoSave(); // 🔥 NEW

    if ('wakeLock' in navigator) {
      try { wakeLock = await navigator.wakeLock.request('screen'); } catch(e){}
    }

    btn.innerHTML = '<i class="fas fa-stop"></i> Stop Ride';
    btn.classList.add("btn-stop");

    watchId = navigator.geolocation.watchPosition(pos => {

      if(lastPos){
        const d = calcDist(
          lastPos.coords.latitude,
          lastPos.coords.longitude,
          pos.coords.latitude,
          pos.coords.longitude
        );

        if(d > 0.003){ // 🔥 better filter
          bikeData.totalOdo += d;
          updateUI();
          saveLocal(); // 🔥 NEW
        }
      }

      lastPos = pos;

    }, err => {
      console.error(err);
    }, {
      enableHighAccuracy: false, // 🔥 battery save
      maximumAge: 3000,
      timeout: 10000
    });

  } else {

    stopAutoSave(); // 🔥 NEW

    navigator.geolocation.clearWatch(watchId);
    watchId = null;
    lastPos = null;

    if(wakeLock) wakeLock.release();

    await updateDoc(doc(db,"users",currentUser.uid),{bikeData});

    btn.innerHTML = '<i class="fas fa-play"></i> Start Ride';
    btn.classList.remove("btn-stop");
  }
};

// 🔥 ALERT SYSTEM
function checkAlert(){
  const fuelLeft = bikeData.fuelLimit - (bikeData.totalOdo - bikeData.lastFuelOdo);

  if(fuelLeft < bikeData.fuelLimit * 0.2){
    showNotification("⛽ Fuel Low!");
  }
}

function showNotification(msg){
  if(Notification.permission === "granted"){
    new Notification("MotoCare", { body: msg });
  }
}

Notification.requestPermission();

</script>
